<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lens · LLM 可观测与评估</title>
<style>
  :root {
    --bg: #fafafa;
    --card: #ffffff;
    --text: #17171a;
    --muted: #71717a;
    --line: #e7e7ea;
    --line-strong: #d4d4d8;
    --accent: #4f46e5;
    --accent-soft: #eef2ff;
    --ok: #16a34a;
    --warn: #c2740a;
    --err: #dc2626;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1220px; margin: 0 auto; padding: 28px 24px 72px; }

  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  h1 { font-size: 21px; font-weight: 620; margin: 0; letter-spacing: -0.02em; }
  .sub { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  .range { display: flex; gap: 2px; background: #f0f0f2; border-radius: 8px; padding: 2px; }
  .range button {
    border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12.5px;
    padding: 5px 11px; border-radius: 6px; cursor: pointer;
  }
  .range button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.07); }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 1px 2px rgba(16,16,20,.03);
  }
  .kpi { padding: 15px 16px; }
  .kpi .label { color: var(--muted); font-size: 12px; margin-bottom: 7px; letter-spacing: .01em; }
  .kpi .value { font-size: 25px; font-weight: 600; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
  .kpi .value small { font-size: 13px; font-weight: 500; color: var(--muted); }
  .kpi .hint { color: var(--muted); font-size: 11.5px; margin-top: 5px; font-family: var(--mono); }

  .grid { display: grid; grid-template-columns: 1fr 320px; gap: 12px; align-items: start; }
  .panel-head {
    display: flex; align-items: center; gap: 8px;
    padding: 13px 16px; border-bottom: 1px solid var(--line);
  }
  .panel-head h2 { font-size: 13px; font-weight: 600; margin: 0; }
  .panel-head .count { color: var(--muted); font-size: 12px; font-family: var(--mono); }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left; font-weight: 500; font-size: 11.5px; color: var(--muted);
    padding: 9px 16px; border-bottom: 1px solid var(--line); text-transform: uppercase;
    letter-spacing: .04em;
  }
  td { padding: 10px 16px; border-bottom: 1px solid #f0f0f2; font-variant-numeric: tabular-nums; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #fbfbfc; }
  tbody tr.open { background: var(--accent-soft); }
  .name { font-weight: 520; }
  .proj { color: var(--muted); font-size: 12px; }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .right { text-align: right; }
  .pill {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 20px;
    border: 1px solid var(--line-strong); color: var(--muted); font-family: var(--mono);
  }
  .pill.err { color: var(--err); border-color: #f8c9c9; background: #fef4f4; }
  .pill.label { color: var(--accent); border-color: #cdd4fb; background: var(--accent-soft); }

  .model-row { display: flex; align-items: center; gap: 10px; padding: 9px 16px; }
  .model-name { flex: 1; font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 0 0 92px; height: 5px; background: #f0f0f2; border-radius: 3px; overflow: hidden; }
  /* display:block matters — a bare inline span ignores height:100% and the bar
     renders as zero height, which silently hides the whole panel. */
  .bar-fill { display: block; height: 100%; background: var(--accent); border-radius: 3px; min-width: 3px; }
  .toggle {
    display: flex; align-items: center; gap: 5px; font-size: 12.5px;
    color: var(--muted); cursor: pointer; margin-right: 12px; user-select: none;
  }
  .toggle input { margin: 0; accent-color: var(--accent); }
  .model-cost { font-family: var(--mono); font-size: 11.5px; color: var(--muted); text-align: right; width: 66px; }

  .waterfall { padding: 14px 16px 18px; background: #fcfcfd; border-bottom: 1px solid var(--line); }
  .wf-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .wf-title { font-size: 12.5px; font-weight: 600; }
  .wf-meta { color: var(--muted); font-size: 11.5px; font-family: var(--mono); }
  .wf-row { display: flex; align-items: center; gap: 10px; height: 24px; }
  .wf-name {
    flex: 0 0 210px; font-family: var(--mono); font-size: 11.5px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; color: #3f3f46;
  }
  .wf-track { flex: 1; height: 16px; position: relative; background: #f4f4f6; border-radius: 3px; }
  .wf-bar { position: absolute; height: 100%; border-radius: 3px; min-width: 2px; opacity: .92; }
  .wf-dur { flex: 0 0 68px; text-align: right; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .wf-tok { flex: 0 0 74px; text-align: right; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .legend { display: flex; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
  .legend span { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .dot { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }

  .eval-wrap { margin-top: 12px; }
  .eval-table td.compact { padding: 8px 16px; }
  .verdict { font-size: 12px; }
  .verdict.good { color: var(--ok); }
  .verdict.flat { color: var(--muted); }
  .ci { font-family: var(--mono); font-size: 11px; color: var(--muted); }

  .empty { padding: 34px 16px; text-align: center; color: var(--muted); font-size: 13px; }
  .empty code { background: #f4f4f6; padding: 2px 6px; border-radius: 4px; font-family: var(--mono); font-size: 12px; }

  @media (max-width: 900px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .grid { grid-template-columns: 1fr; }
    .wf-name { flex-basis: 130px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Lens</h1>
    <span class="sub">LLM 链路追踪与评估</span>
    <span class="spacer"></span>
    <label class="toggle">
      <input type="checkbox" id="showEval" /> 含评测用例
    </label>
    <div class="range" id="range">
      <button data-h="24" class="on">24 小时</button>
      <button data-h="168">7 天</button>
      <button data-h="720">30 天</button>
    </div>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="grid">
    <div class="card">
      <div class="panel-head">
        <h2>执行记录</h2>
        <span class="count" id="runCount"></span>
        <span class="spacer"></span>
        <span class="mgmt mono" id="hint" style="color:var(--muted);font-size:11.5px">点击任意行展开链路</span>
      </div>
      <div id="runs"><div class="empty">加载中…</div></div>
    </div>

    <div class="card">
      <div class="panel-head"><h2>按模型成本</h2></div>
      <div id="models"><div class="empty">—</div></div>
    </div>
  </section>

  <section class="card eval-wrap">
    <div class="panel-head">
      <h2>评估批次</h2>
      <span class="count" id="evalCount"></span>
    </div>
    <div id="evals"><div class="empty">暂无评估数据</div></div>
  </section>
</div>

<script>
const KIND_COLORS = {
  llm: "#4f46e5",
  retrieval: "#0891b2",
  tool: "#c2740a",
  judge: "#7c3aed",
  custom: "#a1a1aa",
};
const state = { hours: 24, includeEval: false };

const fmtMoney = (v) => {
  if (v === null || v === undefined) return "—";
  if (v === 0) return "$0";
  // Scientific notation like $8.9e-5 is unreadable at a glance; prefer plain
  // decimals down to a micro-dollar before giving up on readability.
  if (v < 0.000001) return "$" + v.toExponential(1);
  if (v < 0.01) return "$" + v.toFixed(6);
  if (v < 1) return "$" + v.toFixed(4);
  return "$" + v.toFixed(2);
};
const fmtNum = (v) => (v === null || v === undefined ? "—" : v.toLocaleString("zh-CN"));
const fmtMs = (v) => (v >= 1000 ? (v / 1000).toFixed(2) + "s" : Math.round(v) + "ms");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function getJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(url + " -> " + res.status);
  return res.json();
}

function renderKpis(o) {
  const errRate = o.runs ? ((o.errors / o.runs) * 100).toFixed(1) : "0.0";
  const cards = [
    { label: "执行次数", value: fmtNum(o.runs), hint: `近 ${o.window_hours} 小时` },
    { label: "总成本", value: fmtMoney(o.cost_usd), hint: `${fmtNum(o.tokens)} tokens` },
    { label: "P95 延迟", value: fmtMs(o.p95_latency_ms), hint: `P50 ${fmtMs(o.p50_latency_ms)}` },
    { label: "错误率", value: errRate + "<small>%</small>", hint: `${o.errors} 次失败`, raw: true },
  ];
  document.getElementById("kpis").innerHTML = cards.map((c) => `
    <div class="card kpi">
      <div class="label">${c.label}</div>
      <div class="value">${c.raw ? c.value : esc(String(c.value))}</div>
      <div class="hint">${esc(c.hint)}</div>
    </div>`).join("");
}

function renderModels(rows) {
  const box = document.getElementById("models");
  if (!rows || !rows.length) {
    box.innerHTML = '<div class="empty">暂无模型调用</div>';
    return;
  }
  const max = Math.max(...rows.map((r) => r.cost || 0), 1e-9);
  box.innerHTML = rows.slice(0, 8).map((r) => `
    <div class="model-row">
      <span class="model-name" title="${esc(r.model)}">${esc((r.model || "").split("/").pop())}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${Math.max(2, (r.cost / max) * 100).toFixed(1)}%"></span></span>
      <span class="model-cost">${fmtMoney(r.cost)}</span>
    </div>`).join("");
}

function renderRuns(runs) {
  const box = document.getElementById("runs");
  document.getElementById("runCount").textContent = runs.length ? `${runs.length} 条` : "";
  if (!runs.length) {
    box.innerHTML = '<div class="empty">还没有记录。运行 <code>python examples/demo_agent.py</code> 生成第一条链路。</div>';
    return;
  }
  box.innerHTML = `
    <table>
      <thead><tr>
        <th>名称</th><th>状态</th><th class="right">耗时</th>
        <th class="right">Tokens</th><th class="right">成本</th><th class="right">时间</th>
      </tr></thead>
      <tbody>${runs.map((r) => `
        <tr data-id="${esc(r.id)}">
          <td><span class="name">${esc(r.name)}</span>
            ${r.label ? `<span class="pill label">${esc(r.label)}</span>` : ""}
            <div class="proj">${esc(r.project)}</div></td>
          <td>${r.status === "error"
            ? '<span class="pill err">error</span>'
            : '<span class="pill">ok</span>'}</td>
          <td class="right mono">${r.duration_ms != null ? fmtMs(r.duration_ms) : "—"}</td>
          <td class="right mono">${fmtNum(r.total_tokens)}</td>
          <td class="right mono">${fmtMoney(r.total_cost_usd)}</td>
          <td class="right mono" style="color:var(--muted)">${new Date(r.started_at * 1000).toLocaleTimeString("zh-CN", { hour12: false })}</td>
        </tr>`).join("")}
      </tbody>
    </table>`;
  box.querySelectorAll("tbody tr").forEach((tr) => {
    tr.onclick = () => toggleRun(tr);
  });
}

async function toggleRun(tr) {
  const existing = tr.nextElementSibling;
  if (existing && existing.classList.contains("detail-row")) {
    existing.remove();
    tr.classList.remove("open");
    return;
  }
  document.querySelectorAll(".detail-row").forEach((el) => el.remove());
  document.querySelectorAll("tr.open").forEach((el) => el.classList.remove("open"));
  tr.classList.add("open");

  const data = await getJSON("/api/runs/" + encodeURIComponent(tr.dataset.id));
  const detail = document.createElement("tr");
  detail.className = "detail-row";
  detail.innerHTML = `<td colspan="6" style="padding:0">${renderWaterfall(data)}</td>`;
  tr.after(detail);
}

function renderWaterfall(run) {
  const spans = run.spans || [];
  if (!spans.length) return '<div class="waterfall"><div class="wf-meta">该次执行没有 span</div></div>';

  const byId = new Map(spans.map((s) => [s.id, s]));
  const depthOf = (s) => {
    let d = 0, cur = s, guard = 0;
    while (cur.parent_id && byId.has(cur.parent_id) && guard++ < 50) {
      d++; cur = byId.get(cur.parent_id);
    }
    return d;
  };
  const origin = Math.min(...spans.map((s) => s.started_at));
  const total = Math.max(run.duration_ms || 0, ...spans.map((s) => (s.started_at - origin) * 1000 + (s.duration_ms || 0)), 1);

  const rows = spans.map((s) => {
    const offsetMs = (s.started_at - origin) * 1000;
    const left = Math.min(99, (offsetMs / total) * 100);
    const width = Math.max(0.6, ((s.duration_ms || 0) / total) * 100);
    const depth = depthOf(s);
    const color = KIND_COLORS[s.kind] || KIND_COLORS.custom;
    const tok = (s.prompt_tokens || 0) + (s.completion_tokens || 0);
    const priceTag = s.attributes && s.attributes.pricing === "unknown"
      ? ' <span style="color:var(--warn)" title="价格表未收录该模型">?</span>' : "";
    return `<div class="wf-row">
      <span class="wf-name" style="padding-left:${depth * 14}px" title="${esc(s.name)}">${esc(s.name)}</span>
      <span class="wf-track"><span class="wf-bar" style="left:${left.toFixed(2)}%;width:${width.toFixed(2)}%;background:${color}"></span></span>
      <span class="wf-dur">${s.duration_ms != null ? s.duration_ms.toFixed(1) + "ms" : "—"}</span>
      <span class="wf-tok">${tok ? fmtNum(tok) + " tok" : ""}${priceTag}</span>
    </div>`;
  }).join("");

  const errorNote = run.error
    ? `<div class="wf-meta" style="color:var(--err);margin-top:8px">${esc(run.error)}</div>` : "";

  return `<div class="waterfall">
    <div class="wf-head">
      <span class="wf-title">${esc(run.name)}</span>
      <span class="wf-meta">${spans.length} spans · ${fmtMs(run.duration_ms || 0)} · ${fmtNum(run.total_tokens)} tokens · ${fmtMoney(run.total_cost_usd)}</span>
    </div>
    ${rows}
    <div class="legend">
      ${Object.entries(KIND_COLORS).map(([k, c]) => `<span><i class="dot" style="background:${c}"></i>${k}</span>`).join("")}
    </div>
    ${errorNote}
  </div>`;
}

const VERDICT_ZH = {
  "B is better": "后者更好",
  "A is better": "前者更好",
  "no measurable difference": "无显著差异",
};

async function renderEvals(batches) {
  const box = document.getElementById("evals");
  // Count distinct batches, not rows: one batch with two variants is 1 组, not 2.
  const batchCount = new Set(batches.map((b) => b.batch)).size;
  document.getElementById("evalCount").textContent = batchCount ? `${batchCount} 组` : "";
  if (!batches.length) {
    box.innerHTML = '<div class="empty">暂无评估数据。运行 <code>python examples/run_eval.py</code> 生成一次评测。</div>';
    return;
  }
  const grouped = {};
  for (const b of batches) (grouped[b.batch] ||= []).push(b);

  const blocks = await Promise.all(Object.entries(grouped).map(async ([batch, labels]) => {
    labels.sort((x, y) => String(x.label).localeCompare(String(y.label)));

    const rows = labels.map((l) => {
      const ci = l.ci_low != null
        ? `[${l.ci_low.toFixed(3)}, ${l.ci_high.toFixed(3)}]` : "—";
      return `<tr>
        <td class="compact"><span class="name">${esc(l.label)}</span></td>
        <td class="right compact mono">${l.n}</td>
        <td class="right compact mono">${(l.mean_score ?? 0).toFixed(3)}</td>
        <td class="right compact mono">${((l.pass_rate ?? 0) * 100).toFixed(0)}%</td>
        <td class="right compact ci" title="95% bootstrap 置信区间">${ci}</td>
      </tr>`;
    }).join("");

    let verdict = "";
    if (labels.length >= 2) {
      try {
        const q = `batch=${encodeURIComponent(batch)}&a=${encodeURIComponent(labels[0].label)}&b=${encodeURIComponent(labels[labels.length - 1].label)}`;
        const cmp = await getJSON("/api/eval/compare?" + q);
        if (!cmp.error) {
          const cls = cmp.significant ? "good" : "flat";
          verdict = `<div class="verdict ${cls}" style="padding:11px 16px;border-top:1px solid var(--line);background:#fcfcfd">
            <strong>${esc(labels[0].label)} → ${esc(labels[labels.length - 1].label)}</strong>
            差值 <span class="mono">${cmp.delta >= 0 ? "+" : ""}${cmp.delta.toFixed(3)}</span>，
            95% CI <span class="mono">[${cmp.delta_ci[0].toFixed(3)}, ${cmp.delta_ci[1].toFixed(3)}]</span>，
            p=<span class="mono">${cmp.p_value.toFixed(4)}</span>
            → <strong>${esc(VERDICT_ZH[cmp.verdict] || cmp.verdict)}</strong>
            <span style="color:var(--muted)">（胜 ${cmp.wins} / 负 ${cmp.losses} / 平 ${cmp.ties}，n=${cmp.n}）</span>
          </div>`;
        } else {
          verdict = `<div class="verdict flat" style="padding:11px 16px;border-top:1px solid var(--line)">无法对比：${esc(cmp.error)}</div>`;
        }
      } catch (e) { /* 对比失败不阻塞渲染 */ }
    }

    return `<div style="border-top:1px solid var(--line)">
      <div class="panel-head"><h2 style="font-family:var(--mono);font-size:12px">${esc(batch)}</h2></div>
      <table class="eval-table">
        <thead><tr><th>版本</th><th class="right">用例</th><th class="right">均分</th>
          <th class="right">通过率</th><th class="right">95% CI</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${verdict}
    </div>`;
  }));
  box.innerHTML = blocks.join("");
}

async function refresh() {
  const evalFlag = state.includeEval ? "&include_eval=true" : "";
  try {
    const o = await getJSON(`/api/overview?hours=${state.hours}${evalFlag}`);
    renderKpis(o);
    renderModels(o.by_model);
  } catch (e) { console.error(e); }
  try {
    const r = await getJSON(`/api/runs?limit=40${evalFlag}`);
    renderRuns(r.runs);
  } catch (e) { console.error(e); }
  try {
    const ev = await getJSON("/api/eval/summary");
    renderEvals(ev.batches);
  } catch (e) { console.error(e); }
}

document.getElementById("range").addEventListener("click", (ev) => {
  const btn = ev.target.closest("button");
  if (!btn) return;
  document.querySelectorAll("#range button").forEach((b) => b.classList.remove("on"));
  btn.classList.add("on");
  state.hours = Number(btn.dataset.h);
  refresh();
});

document.getElementById("showEval").addEventListener("change", (ev) => {
  state.includeEval = ev.target.checked;
  refresh();
});

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
