[project]
name = "lens"
version = "0.1.0"
description = "LLM tracing and evaluation harness: measure what your prompts actually do."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lens = "lens.cli:main"
lens-server = "lens.server.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
